# GitLab pipeline: quality gate on every MR, release only on the default branch.
#
# Required package.json scripts: `lint`, `typecheck`, `test:cov`.
# Required CI/CD variable for the release: GITLAB_TOKEN (scope `api` +
# `write_repository`), from Settings -> CI/CD -> Variables. Project variables are
# already exposed to jobs as env vars — there is no need to remap them.

stages:
  - test
  - release

default:
  image: node:24
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

quality:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm run lint
    - npm run typecheck
    - npm run test:cov
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/

release:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  script:
    - npx semantic-release
