name: Release Please

# On every push to main, release-please computes the bump from the conventional
# commits since the last dev-setup-v* tag and opens or updates a running "release PR".
# When that PR is merged, release-please creates the annotated tag + GitHub Release.
#
# Configuration:
#   - release-please-config.json (root): release type, extra-files, changelog path
#   - .release-please-manifest.json (root): the current version (source of truth)
#
# Commit convention: see AGENTS.md → "Types and their effect on the release"

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Needed by the "Rebuild dist" step: without a checkout it would run in an
      # empty workspace. release-please-action does not need it (it uses the APIs).
      - uses: actions/checkout@v4

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # If the release PR was merged in this run, rebuild dist/ at the new version
      # and commit straight to main. This is needed because release-please only bumps
      # the `version` field of plugin.json, while the skills/agents under dist/ are
      # rebuilt only when they change (in practice they do not for a pure release
      # commit — but the rebuild keeps things idempotent and catches any drift).
      # The package is configured on the root path (`.`): release-please v4 emits the
      # root component's outputs WITHOUT a path prefix (`release_created`,
      # `tag_name`). Comparing against 'true' is mandatory: in GitHub Actions `if`
      # expressions every non-empty string is truthy, so the
      # bare `outputs.release_created` would fire the step even when it is 'false'.
      - name: Rebuild dist after release publish
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          command -v jq >/dev/null 2>&1 || sudo apt-get install -y -qq jq
          bash scripts/build-plugin.sh dev-setup
          if ! git diff --quiet -- dist/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/
            git commit -m "chore(dist): rebuild after release ${{ steps.release.outputs.tag_name }}"
            git push origin HEAD:main
          else
            echo "dist/ in sync — niente da committare"
          fi
