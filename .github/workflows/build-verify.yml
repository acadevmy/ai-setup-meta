name: Build Verify

# Checks that `dist/` is in sync with the source (`templates/`, `shared/`, the build
# scripts). It runs `build-plugin.sh` for every template and fails if the rebuild
# would produce any change against the committed `dist/`.

# No path filter: the previous one let through direct pushes and any change outside
# its list (`shared/agents/`, say) — which are exactly the cases where dist/ drift
# reached main without ever turning the job red.
on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [dev-setup]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Build plugin (${{ matrix.template }})
        run: bash scripts/build-plugin.sh ${{ matrix.template }}

      - name: Check dist/ is in sync
        run: |
          if ! git diff --quiet -- dist/ .claude-plugin/; then
            echo "::error::dist/ or marketplace.json is out of sync with templates/. Run 'bash scripts/build-plugin.sh ${{ matrix.template }}' locally and commit the result."
            git --no-pager diff --stat -- dist/ .claude-plugin/
            exit 1
          fi
          echo "✓ dist/ is in sync with templates/"
