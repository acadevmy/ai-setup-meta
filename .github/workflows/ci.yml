name: CI

# Rete di sicurezza del meta-repo (DE-16471). Tre gate indipendenti:
#   - plugin-validate: i manifest del plugin e dei cataloghi marketplace sono validi
#   - shellcheck:      gli script sh non hanno warning
#   - static-checks:   i check statici sulla qualita' delle skill (validate-plugin.sh)
#
# `static-checks` gira contro una baseline di fail noti (scripts/validate-baseline.txt):
# i difetti censiti dall'audit sono riportati ma non bloccano; ogni nuovo difetto si.
# La baseline si svuota con le PR successive della catena — vedi il suo header.

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # `plugin validate` e' una verifica locale dei manifest: non richiede
      # autenticazione ne' rete verso l'API.
      - name: Validate plugin manifest (dist/dev-setup)
        run: claude plugin validate --strict dist/dev-setup/

      - name: Validate marketplace catalog
        run: claude plugin validate --strict .claude-plugin/marketplace.json

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # Tutti gli script del repo: quelli del meta-repo, gli hook nei template
      # e la loro copia in dist/.
      - name: Run shellcheck
        run: |
          find scripts templates dist -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=warning --format=gcc

  static-checks:
    name: static checks (skill quality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest references
        run: bash scripts/validate-setup-urls.sh

      # --fail-on-stale: quando una PR risolve un difetto baselinato, la riga va
      # rimossa dalla baseline nella stessa PR. Impedisce che la baseline invecchi.
      - name: Static skill checks
        run: bash scripts/validate-plugin.sh --fail-on-stale
