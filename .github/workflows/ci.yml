name: CI

# The meta-repo's safety net (DE-16471). Three independent gates:
#   - plugin-validate: the plugin and marketplace catalogue manifests are valid
#   - shellcheck:      the sh scripts carry no warnings
#   - static-checks:   the static checks on skill quality (validate-plugin.sh)
#
# `static-checks` runs against a baseline of known failures (scripts/validate-baseline.txt):
# the defects the audit recorded are reported but do not block; any new defect does.
# The baseline shrinks with the later PRs of the chain — see its own header.

on:
  pull_request:
    branches: [main, next]
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # `plugin validate` e' una verifica locale dei manifest: non richiede
      # autenticazione ne' rete verso l'API.
      - name: Validate plugin manifest (dist/dev-setup)
        run: claude plugin validate --strict dist/dev-setup/

      - name: Validate marketplace catalog
        run: claude plugin validate --strict .claude-plugin/marketplace.json

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # Tutti gli script del repo: quelli del meta-repo, gli hook nei template
      # e la loro copia in dist/.
      - name: Run shellcheck
        run: |
          find scripts templates dist -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=warning --format=gcc

  static-checks:
    name: static checks (skill quality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest references
        run: bash scripts/validate-setup-urls.sh

      # --fail-on-stale: when a PR fixes a baselined defect, its line has to be
      # removed from the baseline in that same PR. This keeps the baseline from ageing.
      - name: Static skill checks
        run: bash scripts/validate-plugin.sh --fail-on-stale
