name: ci

on:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Install
        working-directory: api
        run: composer install --no-interaction
      - name: Lint
        run: make lint
      - name: Test
        run: make test
